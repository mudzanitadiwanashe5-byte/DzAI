<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DZ AI</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, sans-serif; color: #eef2ff;
      background: radial-gradient(circle at top, #18264a, #080b16 65%);
    }
    main { width: min(90%, 620px); padding: 32px; border: 1px solid #33446d;
      border-radius: 20px; background: #10182bcc; box-shadow: 0 20px 70px #0008; }
    .logo { font-size: 42px; font-weight: 800; letter-spacing: 2px; color: #7cf7ff; }
    .logo span { display: block; font-size: 15px; letter-spacing: 8px; color: #aab8dc; }
    p { line-height: 1.6; color: #c5cee5; }
    a { color: #7cf7ff; }
    .status { margin-top: 24px; padding: 14px; border-radius: 12px; background: #172943; }
  </style>
</head>
<body>
  <main>
    <div class="logo">DZ<span>ARTIFICIAL INTELLIGENCE</span></div>
    <h1>Welcome to DZ AI</h1>
    <p>Your personal AI assistant project has started. This is the first working foundation.
       We will add the chat assistant, dashboard, opportunity finder, media tools and integrations
       in later stages.</p>
    <div class="status">Starter dashboard is running. API check: <a href="/api/status">/api/status</a></div>
  </main>
</body>
</html>
